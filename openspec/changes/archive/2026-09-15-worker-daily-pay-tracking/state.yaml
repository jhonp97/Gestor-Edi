  research_pinned_conventions:
    - "Row-local PostgreSQL CHECK constraint (hand-authored migration SQL; Prisma Migrate cannot declare CHECK) enforces PAID => paidAt NOT NULL / PENDING => paidAt NULL; Zod alone is insufficient"
    - "State change + audit row written in one Prisma transaction; audit details carry actor, datetime, previous value, new value (OWASP shape); revert records the cleared paidAt in audit details"
    - "Serializable interactive transactions with bounded retry on P2034/SQLSTATE 40001 (and deadlocks 40P01); unique (organizationId, workerId, periodStart) control row is the serialization anchor"
    - "State-conflicting mark/revert surfaces as HTTP 409 Conflict (RFC 9110 semantics) or a pinned idempotent no-op — spec phase must pin the choice"
    - "No FK/coupling between DailyPayMonthControl and Payroll; independence is enforced by construction and guarded by existing integration tests"
